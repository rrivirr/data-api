apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-api
  labels:
    app: data-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-api
  template:
    metadata:
      labels:
        app: data-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "webapp"
        vault.hashicorp.com/auth-path: "auth/kubernetes-rriv"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-requests-memory: "32Mi"
        vault.hashicorp.com/agent-limits-cpu: "500m"
        vault.hashicorp.com/agent-limits-memory: "128Mi"
        vault.hashicorp.com/secret-volume-path: "/app/config"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/data-api-creds"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/data/data-api-creds" }}
          export DATABASE_URL={{ .Data.data.database_url }}
          {{ end }}

    spec:
      serviceAccountName: internal-app
      imagePullSecrets:
        - name: registry-rriv
      containers:
        - name: data-api
          args: ["dist/server.js"]
          image: registry.digitalocean.com/rriv/data-api
          ports:
            - containerPort: 3006
          env:
            - name: LOG_LEVEL
              value: debug
            - name: DATABASE_SCHEMA
              value: rriv
