apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-api
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject-secret-credentials.txt: "secret/data/prod-timescale-creds"
        vault.hashicorp.com/agent-inject-template-credentials: |
          {{ with secret "secret/data/prod-timescale-creds" }}
          export DATABASE_URL={{ .Data.data.database_url }}
          {{ end }}
    spec:
      containers:
        - name: data-api
          env:
            - name: LOG_LEVEL
              value: info
