apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-api
spec:
  template:
    spec:
      containers:
        - name: data-api
          env:
            - name: KEYCLOAK_URL
              value: https://auth.dev.rriv.org
            - name: KEYCLOAK_REALM
              value: rriv-beta-dev
