apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-api
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/data-api-creds"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/data/data-api-creds" }}
          DATABASE_URL="{{ .Data.data.database_url }}"
          DATABASE_CA_CRT="{{ .Data.data.database_ca_cert }}"
          {{ end }}
    spec:
      containers:
        - name: data-api
          env:
            - name: LOG_LEVEL
              value: info
            - name: KEYCLOAK_URL
              value: https://auth.staging.rriv.org
            - name: KEYCLOAK_REALM
              value: rriv-beta-staging
